name: Run tests

on:
  workflow_call:
    inputs:
      cp-version:
        required: false
        default: '0.0.0+auto'
        type: string
  push:
  workflow_dispatch:

jobs:
  run:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: [all, mpy, native, native_mpy]
    env:
      CP_VERSION: ${{ inputs.cp-version }}
      MICROPY_CPYTHON3: python3.12
      MICROPY_MICROPYTHON: ../ports/unix/build-coverage/micropython
      TEST_all:
      TEST_mpy: --via-mpy -d basics float micropython
      TEST_native: --emit native
      TEST_native_mpy: --via-mpy --emit native -d basics float micropython
    steps:
      - name: Set up repository
        uses: actions/checkout@v6
        with:
          submodules: false
          show-progress: false
          fetch-depth: 1
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Set up submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: tests
      - name: Set up external
        if: matrix.test == 'all'
        uses: ./.github/actions/deps/external
      - name: Set up mpy-cross
        uses: ./.github/actions/mpy_cross
        with:
          cp-version: ${{ inputs.cp-version }}
      - name: Build unix port
        run: make -C ports/unix VARIANT=coverage -j4
      - name: Run tests
        run: ./run-tests.py -j4 ${{ env[format('TEST_{0}', matrix.test)] }}
        working-directory: tests
      - name: Print failure info
        run: ./run-tests.py -j4 --print-failures
        if: failure()
        working-directory: tests
      - name: Build native modules
        if: matrix.test == 'all'
        run: |
          make -C examples/natmod/features1
          make -C examples/natmod/features2
          make -C examples/natmod/heapq
          make -C examples/natmod/random
          make -C examples/natmod/re
      - name: Test native modules
        if: matrix.test == 'all'
        run: ./run-natmodtests.py extmod/{heapq*,random*,re*}.py
        working-directory: tests

  zephyr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    env:
      CP_VERSION: ${{ inputs.cp-version }}
    steps:
      - name: Set up repository
        uses: actions/checkout@v6
        with:
          submodules: false
          show-progress: false
          fetch-depth: 1
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Set up Zephyr
        uses: ./.github/actions/deps/ports/zephyr-cp
      - name: Set up submodules
        id: set-up-submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: zephyr-cp
      - name: Set up external
        uses: ./.github/actions/deps/external
      - name: Build native sim target
        run: make -C ports/zephyr-cp -j2 BOARD=native_native_sim
        env:
          CP_VERSION: 10.3.0-11-g051bccdbaf
      - name: Print 32-bit glibc version
        run: /lib/ld-linux.so.2 --version
      - name: Print SDL video environment
        run: |
          for var in SDL_VIDEODRIVER DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE; do
            echo "$var=${!var:-<unset>}"
          done
          env | grep -i sdl || echo "no SDL_* variables set"
      - name: Run reset Zephyr test
        run: pytest tests/test_reset.py -v
        working-directory: ports/zephyr-cp
      - name: Run one Zephyr display test
        run: pytest tests/zephyr_display/test_zephyr_display.py::test_board_display_available -v
        working-directory: ports/zephyr-cp
      - name: Run safe mode Zephyr test standalone 1
        run: pytest tests/test_saved_word.py -v
        working-directory: ports/zephyr-cp
