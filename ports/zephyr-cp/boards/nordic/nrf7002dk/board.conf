CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n

CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

CONFIG_LOG=n
CONFIG_ASSERT=n
# The app slot cannot spare flash headroom (slot0 fills the internal flash
# after the 68 KB boot partition): compile the wpa_supplicant debug print
# machinery out as well.
CONFIG_WIFI_NM_WPA_SUPPLICANT_NO_DEBUG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BT=n
# Settings only stores BT bond keys here. With BT off, its NVS backend would
# still need storage_partition, which board.overlay removes.
CONFIG_SETTINGS=n

# The app slot has no flash headroom (slot0 fills the internal flash after
# the 68 KB boot partition) for ssl's extra mbedtls parts. The wpa_supplicant
# crypto backend already drags in the TLS 1.2 ECDHE-RSA machinery that
# shared-bindings/ssl needs (key exchange, X.509 cert parsing, RSA signature
# verification and RNG), so skip the rest of ZCP_MBEDTLS_TLS: its larger ECDH
# curves, GCM and PEM parsing do not fit. With PEM parsing off, certs and keys
# can only be loaded as DER.
CONFIG_ZCP_MBEDTLS_TLS=n
# ...and drop the Encrypt-then-MAC extension for the last few hundred bytes
# of app-slot headroom.
CONFIG_MBEDTLS_SSL_ENCRYPT_THEN_MAC=n

# prj.conf always turns the NVS settings backend on, but the settings
# subsystem itself is off on this board; without it NVS is dead weight.
CONFIG_NVS=n
