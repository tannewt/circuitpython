CONFIG_MULTITHREADING=y

# Enable SPI NOR flash driver for external mx25r64 (slot1).
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# Minimize MCUboot size to fit in 64 KB.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SIZE_OPTIMIZATIONS=y

# Retained memory for boot mode (double-tap reset into UF2).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
