CONFIG_SYS_HEAP_RUNTIME_STATS=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_FLASH_MAP_LABELS=y
CONFIG_MAIN_STACK_SIZE=24288

CONFIG_THREAD_STACK_INFO=y
CONFIG_ARCH_POSIX_UPDATE_STACK_INFO=y
CONFIG_STACK_SENTINEL=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_EXCEPTION_STACK_TRACE=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_STACK_SIZE=1536
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1

CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ASSERT=n
CONFIG_LOG_BLOCK_IN_THREAD=n

CONFIG_EVENTS=y

CONFIG_SERIAL=y

CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=2
CONFIG_FRAME_POINTER=n

# Bound the libc arena so it cannot extend past the end of the chosen
# SRAM node into the nocache region handed to the TLSF pools.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y
