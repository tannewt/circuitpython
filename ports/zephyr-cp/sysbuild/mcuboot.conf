# UF2 drag-and-drop firmware update
CONFIG_MCUBOOT_UF2=y
CONFIG_MCUBOOT_UF2_NO_APPLICATION=y
CONFIG_MCUBOOT_UF2_USB_PRODUCT="Adaboot UF2"
CONFIG_MCUBOOT_UF2_USB_VID=0x239A
CONFIG_MCUBOOT_UF2_USB_PID=0x0035
CONFIG_MAIN_THREAD_PRIORITY=0

# Enter UF2 mode via button or double tap reset
CONFIG_MCUBOOT_UF2_ENTRANCE_GPIO=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_MCUBOOT_UF2_ENTRANCE_DOUBLE_TAP=y
CONFIG_BOOT_SERIAL_DOUBLE_TAP_DELAY=500

# Disable serial UART recovery (UF2 is the recovery interface)
CONFIG_MCUBOOT_SERIAL=n

# Heap for UF2 block tracking bitmap (sized from flash area at runtime)
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Detailed USB logging for debugging
CONFIG_LOG=y
# CONFIG_USBD_LOG_LEVEL_DBG=y
# CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
# CONFIG_USBD_MSC_LOG_LEVEL_DBG=y
