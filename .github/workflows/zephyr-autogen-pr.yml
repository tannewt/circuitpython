# Build every zephyr-cp board and open a PR when the committed autogenerated
# files (autogen_board_info.toml) changed as a result.

name: Update Zephyr autogenerated files

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default GITHUB_TOKEN needs elevated permissions to push the autogen
# branch and open the PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autogen:
    name: Build all zephyr-cp boards
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Set up repository
        uses: actions/checkout@v6
        with:
          submodules: false
          show-progress: false
          fetch-depth: 1
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Set up Zephyr
        uses: ./.github/actions/deps/ports/zephyr-cp
        with:
          # native_sim needs the 32-bit SDL2 packages
          sdl: true
      - name: Set up submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: zephyr-cp
      - name: Set up external
        uses: ./.github/actions/deps/external
      - name: Build all boards
        run: make -C ports/zephyr-cp -j$(nproc) all
      - name: Check for autogenerated changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- 'ports/zephyr-cp/boards/**/autogen_board_info.toml')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- 'ports/zephyr-cp/boards/**/autogen_board_info.toml'
          fi
      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: ports/zephyr-cp/boards/**/autogen_board_info.toml
          commit-message: Regenerate zephyr-cp autogen_board_info.toml files
          title: Regenerate zephyr-cp autogenerated board info
          body: |
            The `autogen_board_info.toml` files changed after building all zephyr-cp
            boards on `main`. Created by the "Update Zephyr autogenerated files"
            workflow.
          branch: zephyr-autogen-board-info
          delete-branch: true
