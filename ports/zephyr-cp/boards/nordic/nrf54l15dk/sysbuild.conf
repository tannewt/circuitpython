# Build MCUboot as the bootloader (sysbuild-level Kconfig).
#
# The nRF54L15 DK keeps the Zephyr default RRAM layout: a 62K MCUboot boot
# partition, 712K slot0 (where this app links) and 712K slot1 (the OTA
# target for BLE image uploads).
#
# Validate images by hash only (no signature check, so no signing key is
# needed or embedded). The app build still wraps images with an MCUboot
# header + SHA-256 TLV via imgtool, which is what the bootloader and the
# SMP image upload validate.
#
# This also enables the app-side SMP/MCUmgr support, see the port Kconfig
# ("OTA firmware updates over BLE"). Note the sysbuild-level SB_CONFIG_ prefix.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
