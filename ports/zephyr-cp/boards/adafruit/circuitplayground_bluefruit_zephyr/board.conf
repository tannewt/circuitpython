CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# The board overlay deletes the Zephyr chosen console/shell/mcumgr nodes:
# CircuitPython drives USB CDC ACM through its own usb_cdc bindings. Turn off
# Zephyr's UART console so nothing references the deleted
# DT_CHOSEN(zephyr_console). SERIAL stays on for the dynamically routed UART.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# The CPB has a bare nRF52840, so pin numbers are aQFN73 package pins.
CONFIG_IOBROKER_PACKAGE_NRF52840_AQFN73=y

# PWM instances are enabled in board.overlay with disconnected outputs so
# iobroker can allocate them at runtime for neopixel_write and pwmio.
CONFIG_PWM=y

# SAADC for analogio testing/use (pads resolve to AIN through iobroker)
CONFIG_ADC=y
