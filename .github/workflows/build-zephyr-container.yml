name: Build Zephyr Container

on:
  push:
    branches: [main]
    paths:
      - 'ports/zephyr-cp/Dockerfile'
      - 'ports/zephyr-cp/zephyr-config/west.yml'
  pull_request:
    paths:
      - 'ports/zephyr-cp/Dockerfile'
      - 'ports/zephyr-cp/zephyr-config/west.yml'
  workflow_call:
    outputs:
      image:
        description: Full image reference with tag
        value: ${{ jobs.build-and-push.outputs.image }}
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adafruit/circuitpython-zephyr

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ports/zephyr-cp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image reference output
        id: image-ref
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
