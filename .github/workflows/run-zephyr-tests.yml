name: Run Zephyr tests

on:
  workflow_call:
    inputs:
      cp-version:
        required: true
        type: string

jobs:
  zephyr:
    runs-on: ubuntu-24.04
    name: ${{ matrix.shard }}
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      # One job per board, so each job builds one firmware. Each bsim suite is also split
      # by the zephyr_sample marker, so the tests that build Zephyr samples get their own job.
      matrix:
        include:
          - shard: native_sim
            boards: native_native_sim
            pytest_args: tests/ --ignore=tests/bsim -k 'not native_native_sim_asan and not native_native_sim_lfs' -n $(nproc) --dist loadfile
          - shard: native_sim_asan
            boards: native_native_sim_asan
            pytest_args: tests/ --ignore=tests/bsim -k native_native_sim_asan -n $(nproc) --dist loadfile
          - shard: native_sim_lfs
            boards: native_native_sim_lfs
            pytest_args: tests/ --ignore=tests/bsim -k native_native_sim_lfs -n $(nproc) --dist loadfile
          - shard: nrf5340bsim
            boards: native_nrf5340bsim
            pytest_args: tests/bsim -k native_nrf5340bsim -m 'not zephyr_sample' -n $(nproc) --dist loadfile
          - shard: nrf5340bsim-samples
            boards: native_nrf5340bsim
            pytest_args: tests/bsim -k native_nrf5340bsim -m zephyr_sample -n $(nproc) --dist loadfile
          - shard: nrf54lm20bsim
            boards: native_nrf54lm20bsim
            pytest_args: tests/bsim -k native_nrf54lm20bsim -m 'not zephyr_sample' -n $(nproc) --dist loadfile
          - shard: nrf54lm20bsim-samples
            boards: native_nrf54lm20bsim
            pytest_args: tests/bsim -k native_nrf54lm20bsim -m zephyr_sample -n $(nproc) --dist loadfile
    env:
      CP_VERSION: ${{ inputs.cp-version }}
    steps:
      - name: Set up repository
        uses: actions/checkout@v6
        with:
          submodules: false
          show-progress: false
          fetch-depth: 1
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Set up Zephyr
        uses: ./.github/actions/deps/ports/zephyr-cp
        with:
          sdl: true
      - name: Set up submodules
        id: set-up-submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: zephyr-cp
      - name: Set up external
        uses: ./.github/actions/deps/external
      - name: Build bsim
        if: contains(matrix.shard, 'bsim')
        run: make -j $(nproc) everything
        working-directory: ports/zephyr-cp/tools/bsim
      - name: Run Zephyr tests
        run: make -C ports/zephyr-cp -j$(nproc) test TEST_BOARDS="${{ matrix.boards }}" PYTEST_ARGS="${{ matrix.pytest_args }}"
