name: Build boards

on:
  workflow_call:
    inputs:
      boards:
        required: true
        type: string
      cp-version:
        required: true
        type: string
      port:
        required: true
        type: string
      container-image:
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  # ── Containerized build (toolchains + deps pre-installed) ──────────────
  board-container:
    if: inputs.container-image != ''
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CP_VERSION: ${{ inputs.cp-version }}
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.boards) }}
    steps:
    - name: Set up repository
      uses: actions/checkout@v4
      with:
        submodules: false
        show-progress: false
        fetch-depth: 1
        persist-credentials: false

    - name: Set up submodules
      id: set-up-submodules
      uses: ./.github/actions/deps/submodules

    # ESP-IDF needs its submodule initialized and export.sh sourced
    - name: Initialize ESP-IDF submodule
      if: inputs.port == 'espressif'
      run: git submodule update --init --depth=1 --recursive ports/espressif/esp-idf

    - name: Set ESP-IDF environment
      if: inputs.port == 'espressif'
      run: |
        export IDF_PATH=$GITHUB_WORKSPACE/ports/espressif/esp-idf
        echo "IDF_PATH=$IDF_PATH" >> $GITHUB_ENV
        # IDF_TOOLS_PATH is set in the container (/opt/esp-idf-tools)
        source $IDF_PATH/export.sh
        echo "$PATH" >> $GITHUB_PATH
      shell: bash

    - name: Set IDF constraints
      if: inputs.port == 'espressif'
      run: python3 -u tools/ci_set_idf_constraint.py

    - name: Set up mpy-cross
      if: steps.set-up-submodules.outputs.frozen == 'True'
      uses: ./.github/actions/mpy_cross
      with:
        cp-version: ${{ inputs.cp-version }}

    - name: Versions
      run: |
        gcc --version
        python3 --version
        cmake --version || true
        ninja --version || true
        aarch64-none-elf-gcc --version || true
        arm-none-eabi-gcc --version || true
        xtensa-esp32-elf-gcc --version || true
        riscv32-esp-elf-gcc --version || true
        riscv64-unknown-elf-gcc --version || true
        mkfs.fat --version || true

    - name: Set up build failure matcher
      run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/workflows/match-build-fail.json"

    - name: Build board
      run: python3 -u build_release_files.py
      working-directory: tools
      env:
        BOARDS: ${{ matrix.board }}
        PULL: ${{ github.event.number }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.board }}
        path: bin/${{ matrix.board }}

    - name: Upload to S3
      uses: ./.github/actions/upload_aws
      with:
        source: bin/
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ── Bare runner build (current approach, for ports without containers) ─
  board-bare:
    if: inputs.container-image == ''
    runs-on: ubuntu-24.04
    env:
      CP_VERSION: ${{ inputs.cp-version }}
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.boards) }}
    steps:
    - name: Set up repository
      uses: actions/checkout@v4
      with:
        submodules: false
        show-progress: false
        fetch-depth: 1
        persist-credentials: false

    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Set up port
      id: set-up-port
      uses: ./.github/actions/deps/ports
      with:
        board: ${{ matrix.board }}
        port: ${{ inputs.port }}

    - name: Set up submodules
      id: set-up-submodules
      uses: ./.github/actions/deps/submodules

    - name: Set up external
      uses: ./.github/actions/deps/external
      with:
        port: ${{ inputs.port }}

    - name: Set up mpy-cross
      if: steps.set-up-submodules.outputs.frozen == 'True'
      uses: ./.github/actions/mpy_cross
      with:
        cp-version: ${{ inputs.cp-version }}

    - name: Versions
      run: |
        gcc --version
        python3 --version
        cmake --version || true
        ninja --version || true
        aarch64-none-elf-gcc --version || true
        arm-none-eabi-gcc --version || true
        xtensa-esp32-elf-gcc --version || true
        riscv32-esp-elf-gcc --version || true
        riscv64-unknown-elf-gcc --version || true
        mkfs.fat --version || true

    - name: Set up build failure matcher
      run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/workflows/match-build-fail.json"

    - name: Build board
      run: python3 -u build_release_files.py
      working-directory: tools
      env:
        BOARDS: ${{ matrix.board }}
        PULL: ${{ github.event.number }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.board }}
        path: bin/${{ matrix.board }}

    - name: Upload to S3
      uses: ./.github/actions/upload_aws
      with:
        source: bin/
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
